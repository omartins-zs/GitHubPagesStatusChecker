<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verifique o status dos seus sites hospedados no GitHub Pages de qualquer usuário.">
  <title>GitHub Pages Status Checker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="header__badge">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.395-.135-.345-.72-1.395-1.23-1.665-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub Pages
      </div>
      <h1 class="header__title">Status <span>Checker</span></h1>
      <p class="header__subtitle">Verifique rapidamente quais repositórios possuem GitHub Pages ativo e se estão acessíveis online.</p>
    </header>

    <section class="search-card" aria-label="Formulário de busca">
      <div class="search-card__grid">
        <div class="form-group">
          <label class="form-label" for="github-username">Usuário do GitHub</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="github-username" class="form-input" placeholder="ex: octocat" autocomplete="username" aria-describedby="username-error">
          </div>
          <span id="username-error" class="form-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="github-token">
            Token de acesso
            <span class="form-label__optional">(opcional)</span>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="github-token" class="form-input form-input--token" placeholder="ghp_..." autocomplete="off">
            <button type="button" id="toggle-token" class="toggle-visibility" aria-label="Mostrar token">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-hint">Evita limites de requisição da API do GitHub</span>
        </div>

        <div class="search-card__actions">
          <button type="button" id="submit-btn" class="btn btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
            Verificar Repositórios
          </button>
          <button type="button" id="clear-btn" class="btn btn--ghost">Limpar</button>
        </div>
      </div>
    </section>

    <section id="stats-bar" class="stats-bar" aria-label="Estatísticas">
      <div class="stat-card stat-card--total">
        <div id="stat-total" class="stat-card__value">0</div>
        <div class="stat-card__label">Total</div>
      </div>
      <div class="stat-card stat-card--online">
        <div id="stat-online" class="stat-card__value">0</div>
        <div class="stat-card__label">Online</div>
      </div>
      <div class="stat-card stat-card--warning">
        <div id="stat-warning" class="stat-card__value">0</div>
        <div class="stat-card__label">Parcial</div>
      </div>
      <div class="stat-card stat-card--offline">
        <div id="stat-offline" class="stat-card__value">0</div>
        <div class="stat-card__label">Offline</div>
      </div>
    </section>

    <div id="toolbar" class="toolbar">
      <div class="filter-chips" role="group" aria-label="Filtrar por status">
        <button type="button" class="chip active" data-filter="all">Todos</button>
        <button type="button" class="chip" data-filter="online">Online</button>
        <button type="button" class="chip" data-filter="warning">Parcial</button>
        <button type="button" class="chip" data-filter="offline">Offline</button>
      </div>
      <div class="search-filter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="search" id="search-filter" placeholder="Buscar repositório..." aria-label="Buscar repositório">
      </div>
    </div>

    <main id="repo-grid" class="repo-grid" aria-live="polite"></main>

    <footer class="footer">
      <p>GitHub Pages Status Checker &mdash; verifica status via API do GitHub</p>
    </footer>
  </div>

  <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
    <div class="spinner" role="status" aria-label="Carregando"></div>
    <p class="loading-overlay__text">Carregando...</p>
    <p id="loading-progress" class="loading-overlay__progress"></p>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="assets/js/app.js"></script>
</body>

</html>
